services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: setupninja-demo:local
    container_name: setupninja-demo
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4174:4174"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4174"
      COOKIE_SECURE: "true"
      SETUPNINJA_DATA_DIR: /var/lib/setupninja
    volumes:
      - setupninja_data:/var/lib/setupninja
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  setupninja_data:
